# Options of rf433, usually /etc/rf433/rf433_options.conf
# Every option is optional; missing options keep their default.

[rf433]
# LIRC device of the 433 MHz transmitter (gpio-ir-tx)
device = /dev/lirc0
# folder of the code files (*.conf)
codes = /etc/rf433/rf433.conf.d
# frames sent when neither the code nor the remote sets repeat
repeat = 10
# upper limit for repeat
max_repeat = 100
# CPU core used while sending, empty = the highest one
cpu_core =
# SCHED_FIFO priority while sending
priority = 50

[learn]
# rtl_433 device (-d), empty = rtl_433 default
device =
frequency = 433.92M
sample_rate = 250k
seconds = 10
# systemd service that uses the receiver and is stopped while learning, empty = none
service =
