# Example code file with made-up codes.
# Every code is one frame: pulse, pause, pulse, …, ending with the pause after the frame (in µs).

begin remote
  name    Example_Socket
  repeat  10

  begin raw_codes
    name A_on
      300  900  300  900  900  300  300  900
      300  900  900  300  300  900  900  300
      300  900  300  900  900  300  900  300
      300  9300

    name A_off
      300  900  300  900  900  300  300  900
      300  900  900  300  300  900  900  300
      300  900  300  900  300  900  300  900
      300  9300

    name All_off
      repeat 20
      300  900  900  300  900  300  300  900
      300  900  900  300  300  900  900  300
      300  900  300  900  300  900  300  900
      300  9300
  end raw_codes
end remote
